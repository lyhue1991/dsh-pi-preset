# The `pi` agent preset: pi's system prompt and pi's real coding tools.
#
# Tools are the actual @earendil-works/pi-coding-agent implementations
# (bash/read/edit/write/grep/find/ls), created by pi's own factories in
# ./pi-tools.js and bridged onto the DSH `tools` registry. The persona is
# the output of pi's own buildSystemPrompt for that same tool set, mounted
# as the sole (complete) prompt section with the DSH runtime context
# suppressed — so the model sees exactly the prompt pi would send.
#
# Everything model-facing that is not pi (DSH fs/search/bash tools, subagents,
# workflows, plan mode, ask-user, todo, web, jobs) is deliberately absent.
# Skills are the exception: DSH's standard skill stack is kept because the
# user prefers its tool-based loading over pi's prompt-injection mechanism.
# Infrastructure rows that are not model-facing (compaction policy) are kept,
# because a preset owns its compaction policy.

# ── identity ────────────────────────────────────────────────────────────────

# pi's system prompt, generated by pi's buildSystemPrompt for the seven tools
# this preset registers. `{{cwd}}` resolves from the agent's own workspace.
# `complete: true` makes this the sole prompt section; `includeRuntimeContext:
# false` drops the DSH runtime context block pi's prompt does not carry.
#
# dsh 0.1.3-alpha.2 renamed the persona row's `text` key to `prefix`
# (required). The same text is therefore shipped under BOTH keys through a
# YAML anchor: dsh 0.1.2 (DSH Desktop) reads `text`, dsh 0.1.3+ (dsh web)
# reads `prefix`, and each schema ignores the key it does not know. Drop the
# `text` key once dsh 0.1.2 support is retired.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: &pi-persona |
      You are an expert coding assistant operating inside pi, a coding agent harness. You help users by reading files, executing commands, editing code, and writing new files.

      Available tools:
      - read: Read file contents
      - bash: bash(command, yield_time_ms?): run any shell command; long-running ones return session_id for bash_io
      - bash_io: bash_io(session_id, chars?, yield_time_ms?): poll or send input to a bash process
      - edit: Make precise file edits with exact text replacement, including multiple disjoint edits in one call
      - write: Create or overwrite files
      - grep: Search file contents for patterns (respects .gitignore)
      - find: Find files by glob pattern (respects .gitignore)
      - ls: List directory contents

      In addition to the tools above, you may have access to other custom tools depending on the project.

      Guidelines:
      - Use read to examine files instead of cat or sed.
      - `bash` runs all shell commands. Short commands finish within yield_time_ms (default 2s) and return full output directly.
      - For commands still running after the wait, `bash` returns a `session_id` - poll it via `bash_io` (empty chars) or raise yield_time_ms for commands that need more time to produce output.
      - Poll a running process by calling `bash_io` with an empty `chars` string and the `session_id`.
      - Send input or Ctrl-C to a running process via `bash_io` with `chars` set to the input text or `\u0003` for Ctrl-C.
      - After a process exits (exit code returned), do NOT call `bash_io` for that `session_id` again.
      - Use edit for precise changes (edits[].oldText must match exactly)
      - When changing multiple separate locations in one file, use one edit call with multiple entries in edits[] instead of multiple edit calls
      - Each edits[].oldText is matched against the original file, not after earlier edits are applied. Do not emit overlapping or nested edits. Merge nearby changes into one edit.
      - Keep edits[].oldText as small as possible while still being unique in the file. Do not pad with large unchanged regions.
      - Use write only for new files or complete rewrites.
      - Be concise in your responses
      - Show file paths clearly when working with files

      Current working directory: {{cwd}}
    text: *pi-persona
    complete: true
    includeRuntimeContext: false

# ── pi tools ────────────────────────────────────────────────────────────────

# Relative specifiers: resolve against this preset's own directory, so the
# plugins and their local node_modules (@earendil-works/pi-coding-agent, the
# pinned @deepseek-ai/dsh-tools they register through, typebox, and the
# vendored pi-codex build) travel with the preset. No row publishes a
# service, so no isolate realm is needed.
#
# pi-coding-tools registers pi's read/edit/write/grep/find/ls factories.
# pi-codex-bash registers pi-codex's non-blocking bash + bash_io, replacing
# pi's synchronous bash under the same tool name.
- id: pi-coding-tools
  name: ./pi-coding-tools.js

- id: pi-codex-bash
  name: ./pi-codex-bash.js

# DSH Desktop loads dsh-ppt-composer on the host plane, which otherwise makes
# its inherited pptd_* and ppt_* tools visible to every preset. Restrict those
# host tools only for Pi; other presets and presentation tools are unaffected.
- id: pi-disable-ppt-tools
  name: ./pi-disable-ppt-tools.js

# ── skills ──────────────────────────────────────────────────────────────────

# DSH's standard skill stack (as in `standard`): the skill REGISTRY lives in
# the host composition and is layered per scope; these rows register into THIS
# preset's layer, so they need no realm. The catalog reaches the model as a
# <system-reminder> message, not a prompt section, so the complete persona
# does not swallow it.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tools (get_goal / create_goal / update_goal), as in
# `standard`. The goal SERVICE, its session driver, and the `/goal` command
# stay on the host plane; the registry is keyed by session, so one host
# instance serves every session. The row's guidance section does not render
# under the complete persona — the tool descriptions carry the semantics.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# Kept from `standard`: a preset owns its compaction policy, and this is
# model-facing infrastructure rather than a tool. `compaction-basic` reads
# `toolResultPrune` through `ctx.get`, so the pruner shares this realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
